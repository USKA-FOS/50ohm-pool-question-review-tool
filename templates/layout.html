<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ title or "Question Pool Review Tool" }}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css?v={{ static_version }}">

    <link href="https://cdn.jsdelivr.net/npm/katex@0.16.28/dist/katex.min.css"
          rel="stylesheet"
          integrity="sha384-Wsr4Nh3yrvMf2KCebJchRJoVo1gTU6kcP05uRSh5NV3sj9+a8IomuJoQzf3sMq4T"
          crossorigin="anonymous">

    <!-- The loading of KaTeX is deferred to speed up page rendering -->
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.28/dist/katex.min.js"
                  integrity="sha384-+W9OcrYK2/bD7BmUAk+xeFAyKp0QjyRQUCxeU31dfyTt/FrPsUgaBTLLkVf33qWt"
                  crossorigin="anonymous"></script>

    <!-- To automatically render math in text elements, include the auto-render extension: -->
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.28/dist/contrib/auto-render.min.js" 
                  integrity="sha384-hCXGrW6PitJEwbkoStFjeJxv+fSOOQKOPbJxSfM6G5sWZjAyWhXiTIIAmQqnlLlh" crossorigin="anonymous">
                  </script>
    <script>
    document.addEventListener("DOMContentLoaded", function() {
        renderMathInElement(document.body, {
          // customised options
          // • auto-render specific keys, e.g.:
          // FIXME: Check which ones of these we really need
          delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
          ],
          // • rendering keys, e.g.:
          throwOnError : false
        });
    });
    </script>

</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="{% if campaign_id %}/campaign/{{ campaign_id }}/{% else %}/{% endif %}">Question Pool Review Tool</a>

        {% if request.session.get("token") %}
            <a class="btn btn-outline-light" href="/logout?campaign_id={{ campaign_id or '' }}">Logout</a>
        {% else %}
            <a class="btn btn-outline-light" href="/login?campaign_id={{ campaign_id or '' }}">Login with GitHub</a>
        {% endif %}
    </div>
</nav>

<div class="container mt-4">
    {% block content %}{% endblock %}
</div>

<div id="busy-overlay" class="busy-overlay" aria-live="polite" aria-hidden="true" hidden>
    <div class="busy-message">
        <div class="spinner-border" role="status" aria-hidden="true"></div>
        <span>Please wait. Working with GitHub...</span>
    </div>
</div>

<script>
function hideBusyIndicator() {
    const overlay = document.getElementById("busy-overlay");
    if (overlay) {
        overlay.hidden = true;
        overlay.setAttribute("aria-hidden", "true");
    }
}

window.addEventListener("pageshow", hideBusyIndicator);
window.addEventListener("load", hideBusyIndicator);

document.addEventListener("DOMContentLoaded", function() {
    const overlay = document.getElementById("busy-overlay");
    hideBusyIndicator();
    const showBusy = function() {
        overlay.hidden = false;
        overlay.setAttribute("aria-hidden", "false");
    };

    document.querySelectorAll("form").forEach(function(form) {
        form.addEventListener("submit", showBusy);
    });
    document.querySelectorAll('a[href^="/"]').forEach(function(link) {
        link.addEventListener("click", function(event) {
            if (!event.defaultPrevented && !link.classList.contains("disabled")) {
                showBusy();
            }
        });
    });
});
</script>

</body>
</html>
