services:
  question-review:
    build:
      context: .
    image: 50ohm-pool-question-review-tool:local
    container_name: 50ohm-question-review-isq
    restart: unless-stopped
    init: true
    # Match the owner of campaigns.json so it can remain mode 600.
    user: "${QRT_FILE_UID:-1006}:${QRT_FILE_GID:-1006}"
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env
    environment:
      URL_PREFIX: /isq/qrt
      SESSION_HTTPS_ONLY: "true"
      CAMPAIGNS_FILE: /app/config/campaigns.json
    volumes:
      - ./campaigns.json:/app/config/campaigns.json:ro
    ports:
      - "127.0.0.1:18082:8080"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
