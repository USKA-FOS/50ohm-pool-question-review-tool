[project]
name = "fifty-ohm-pool-question-review-tool"
version = "0.1.0"
description = "Web review client for canonical question campaigns"
requires-python = ">=3.14"
dependencies = [
  "fastapi", "uvicorn", "python-dotenv", "jinja2",
  "python-multipart", "requests", "starlette", "itsdangerous",
]

[tool.uv]
package = false

[dependency-groups]
dev = ["pytest>=9.1.1", "httpx>=0.28"]

[tool.pytest.ini_options]
testpaths = ["tests"]
