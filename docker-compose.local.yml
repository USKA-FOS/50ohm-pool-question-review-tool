services:
  question-review:
    build:
      context: .
    image: 50ohm-question-review-tool:local
    container_name: 50ohm-question-review-local
    init: true
    security_opt:
      - no-new-privileges:true
    env_file:
      - ${HOME}/.config/50ohm-review-tool/local.env
    volumes:
      - ./campaigns.json:/app/config/campaigns.json:ro
    ports:
      - 127.0.0.1:8080:8080
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
