services:
  question-review:
    build:
      context: .
    image: 50ohm-pool-question-review-tool:local
    container_name: 50ohm-question-review
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env
    environment:
      VIRTUAL_HOST: ${APP_HOST}
      VIRTUAL_PORT: "8080"
      LETSENCRYPT_HOST: ${APP_HOST}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}
    expose:
      - "8080"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - rproxy_net

networks:
  rproxy_net:
    external: true
